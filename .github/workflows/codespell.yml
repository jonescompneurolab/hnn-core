---
name: Codespell

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (used by post_merge_ci.yml)
        type: string
        default: ''
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: Codespell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Codespell
        uses: codespell-project/actions-codespell@v2

