# [build-system]
# requires = ["setuptools>=40.8.0", "NEURON >=7.7, <=8.2.7; platform_system != 'Windows'"]
# build-backend = "setuptools.build_meta:__legacy__"
[build-system]
# >=77 is needed for the SPDX `license` string and `license-files`
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hnn-core"
dynamic = ["version"]
description = "Code for biophysical simulation of a cortical column using Neuron"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
maintainers = [{ name = "Austin E. Soplata", email = "me@asoplata.com" }]
requires-python = ">=3.9, <3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy >=1.14",
    'NEURON >=7.7, <=8.2.7; platform_system != "Windows"',
    "matplotlib>=3.5.3",
    "scipy",
    "h5io",
]

# `scikit-learn` requires installation of `joblib`, so technically, running optimization
# code does not strictly require installation of the `[parallel]` extras. However, it
# *does* require some of the same packages that are installed in the `[parallel]`
# extras. `joblib` will thus be installed in the `[gui]` extras case, but via the
# `scikit-learn` dependency, not via the `[parallel]` extras.
[project.optional-dependencies]
opt = ["cma", "scikit-learn"]
parallel = ["joblib", "psutil"]
test = [
    "codespell",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff<0.16.0",
]
docs = [
    "mne",
    "myst-parser",
    "nibabel",
    "numpydoc",
    "pillow",
    "pooch<1.9.0",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-copybutton",
    "tdqm",
]
gui = [
    "hnn-core[opt]",
    "ipywidgets>=8.0.0",
    "ipykernel",
    "ipympl",
    "voila",
]
all = ["hnn-core[opt,parallel,gui]"]
dev = ["hnn-core[opt,parallel,test,docs,gui]"]

[project.urls]
Download = "https://github.com/jonescompneurolab/hnn-core"

[project.scripts]
hnn-gui = "hnn_core.gui.gui:launch"

[tool.setuptools]
platforms = ["any"]
# Only ship the files listed in `package-data` (e.g. not compiled mechanisms in mod/)
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "hnn_core.__version__" }

[tool.setuptools.packages.find]
include = ["hnn_core*"]
# Match `find_packages()`: skip directories without an `__init__.py`
namespaces = false

[tool.setuptools.package-data]
hnn_core = [
    "mod/*.mod",
    "param/*.json",
    "gui/*.css",
    "gui/*.ipynb",
    "gui/*.js",
]

[tool.codespell]
skip = '.git,*.pdf,*.svg,./hnn_core/mod,./doc/_build,./build,*venv*,.pixi,pixi*'
check-hidden = true
# in jupyter notebooks - images and also some embedded outputs
ignore-regex = '^\s*"image/\S+": ".*|.*%22%3A%20.*'
ignore-words-list = 'tha,nam,sherif,dout'

[tool.ruff]
exclude = ["*.ipynb"]
[tool.ruff.lint]
exclude = ["__init__.py"]
ignore = [
   "E722",  # E722 is a pycodestyle PEP8 style violation called "bare-except".
            # It indicates that the best practice of catching a specific
            # Exception, as opposed to any, was not followed. For more details,
            # see https://www.flake8rules.com/rules/E722.html
]
